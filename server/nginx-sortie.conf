# Sortie!  —  sortiethegame.com
#
# Port 80 only at this point: certbot needs to answer an ACME challenge here before there is a
# certificate to listen with. `certbot --nginx` rewrites this file with the 443 block and the
# redirect once it succeeds.
server {
    server_name sortiethegame.com www.sortiethegame.com;

    root /var/www/sortie;
    index index.html;

    # Let's Encrypt webroot challenge.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location /api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        # The service decides the client's IP from this and trusts nothing else in the chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location / { try_files $uri $uri/ =404; }

    # Bound to the public addresses rather than the wildcard: tailscaled already holds :443 on
    # the tailnet addresses for a separate service, and a wildcard bind collides with that.
    listen 72.62.196.152:443 ssl; # managed by Certbot
    listen [2a02:4780:5e:c690::1]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sortiethegame.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sortiethegame.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.sortiethegame.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = sortiethegame.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name sortiethegame.com www.sortiethegame.com;
    return 404; # managed by Certbot




}