# Sortie!  —  the game's own host.
# Port 80 only for now: certbot needs to answer an ACME challenge here before there is a
# certificate to listen with. Once `certbot --nginx -d sortie.questfor.ge` has run it rewrites
# this file with the 443 block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name sortie.questfor.ge;

    root /var/www/sortie;
    index index.html;

    # Let's Encrypt webroot challenge.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location /api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        # The service decides the client's IP from this and trusts nothing else in the chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location / { try_files $uri $uri/ =404; }
}
