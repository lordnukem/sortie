# Sortie!  —  sortiethegame.com
#
# A REFERENCE COPY of the sortie-owned parts of /etc/nginx/sites-available/sortie, not a
# drop-in replacement for it. Do not `cp` this over the live file: the live vhost also proxies
# an unrelated service on this host, and certbot owns the `listen`/`ssl_*` lines and rewrites
# them. Read this to see what the site expects; change the live file by hand and sync back.
#
# This copy sat stale from 2026-10-26 until 2026-11-02 while the live file gained the manifest
# type, the sw.js no-cache rule and the Cache-Control headers below. A stale copy of a config
# is worse than no copy, because the next person to trust it reverts a fix silently.
server {
    server_name sortiethegame.com www.sortiethegame.com;

    root /var/www/sortie;

    # nginx's mime.types has no .webmanifest, so it would go out as octet-stream and some
    # browsers refuse to treat that as a manifest at all. Set on this one file: a server-level
    # `types` block does not add to the inherited map, it REPLACES it, and everything else on
    # the site turns into octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # The worker decides what is cached; it must not be served from a cache itself, or a deploy
    # cannot replace the thing that controls caching.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    index index.html;

    # Cache headers, added after a stale copy of assets/ship-models.js was served against a fresh
    # index.html: the page had eleven ships in it, the cached bundle had five, and every ship in
    # the game fell back to primitives. Nothing here set Cache-Control at all, so browsers were
    # free to invent their own freshness from Last-Modified. Now they are told.
    #   - HTML revalidates every time. It is small, and it is what names every other file.
    #   - Assets cache for a week. The ones that change in place carry a ?v= content stamp.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Let's Encrypt webroot challenge.
    location /.well-known/acme-challenge/ { root /var/www/html; }



    location /api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        # The service decides the client's IP from this and trusts nothing else in the chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }
    location /ws {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    location / { try_files $uri $uri/ =404; }

    # Bound to the public addresses rather than the wildcard: tailscaled already holds :443 on
    # the tailnet addresses for a separate service, and a wildcard bind collides with that.
    listen 72.62.196.152:443 ssl; # managed by Certbot
    listen [2a02:4780:5e:c690::1]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sortiethegame.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sortiethegame.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.sortiethegame.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = sortiethegame.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name sortiethegame.com www.sortiethegame.com;
    return 404; # managed by Certbot




}
